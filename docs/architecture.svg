<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Arial,sans-serif">
<rect width="1100" height="640" fill="#fff"/>
<text x="550" y="34" text-anchor="middle" font-size="24" font-weight="bold">Handwritten Notes Digitizer - Architecture &amp; Flow</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#333"/></marker></defs>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M190,120 H230"/><path d="M400,120 H440"/><path d="M610,120 H650"/><path d="M820,120 H860"/>
<path d="M945,150 V230"/><path d="M945,300 V340 H720"/><path d="M550,370 H420"/><path d="M290,370 H230"/>
<path d="M550,160 V300"/></g>
<g font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">
<rect x="20" y="80" width="170" height="80" rx="10" fill="#6b7280"/><text x="105" y="115">1. INPUT</text><text x="105" y="136" font-weight="normal">Photo of note</text>
<rect x="230" y="80" width="170" height="80" rx="10" fill="#2563eb"/><text x="315" y="115">2. OpenCV</text><text x="315" y="136" font-weight="normal">denoise, deskew</text>
<rect x="440" y="80" width="170" height="80" rx="10" fill="#2563eb"/><text x="525" y="115">3. Segment</text><text x="525" y="136" font-weight="normal">split into lines</text>
<rect x="650" y="80" width="170" height="80" rx="10" fill="#059669"/><text x="735" y="115">4. OCR ENGINE</text><text x="735" y="136" font-weight="normal">TrOCR / Tesseract</text>
<rect x="860" y="80" width="200" height="80" rx="10" fill="#7c3aed"/><text x="960" y="115">5. Raw text</text><text x="960" y="136" font-weight="normal">line by line</text>
<rect x="850" y="230" width="190" height="70" rx="10" fill="#d97706"/><text x="945" y="260">6. Flask Web UI</text><text x="945" y="282" font-weight="normal">review &amp; edit text</text>
<rect x="550" y="330" width="170" height="80" rx="10" fill="#dc2626"/><text x="635" y="365">7. SQLite + FTS5</text><text x="635" y="387" font-weight="normal">store &amp; search</text>
<rect x="290" y="330" width="130" height="80" rx="10" fill="#0891b2"/><text x="355" y="365">8. Export</text><text x="355" y="387" font-weight="normal">DOCX XML TXT</text>
<rect x="60" y="330" width="170" height="80" rx="10" fill="#6b7280"/><text x="145" y="365">Editable notes</text><text x="145" y="387" font-weight="normal">.docx .xml .md .json</text>
</g>
<rect x="60" y="450" width="980" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="80" y="480" font-size="17" font-weight="bold">Offline training (one-time):</text>
<text x="80" y="510" font-size="15">HuggingFace dataset (IAM-line) -&gt; fine-tune TrOCR (PyTorch + Transformers) -&gt; evaluate on test split (CER/WER)</text>
<text x="80" y="535" font-size="15">-&gt; target: character accuracy &gt;= 94 % -&gt; saved model loaded by step 4.</text>
<text x="80" y="570" font-size="15" fill="#374151">Open-source stack: Python - OpenCV - Tesseract - HuggingFace/PyTorch - Flask - SQLite - python-docx</text>
</svg>
